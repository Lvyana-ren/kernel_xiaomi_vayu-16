
name: Build Vayu Kernel - Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex \
            libssl-dev libelf-dev \
            build-essential lzop cpio \
            device-tree-compiler python3 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            clang-14 lld-14 llvm-14 \
            lz4 zip

      - name: Verify source
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          test -f Makefile
          test -f arch/arm64/configs/vayu_defconfig
          echo "vayu_defconfig found"

      - name: Configure baseline kernel
        run: |
          make vayu_defconfig
          make olddefconfig
          grep -E 'CONFIG_DRM=|CONFIG_DRM_MSM=' .config || true

      - name: Build kernel
        run: |
          make -j"$(nproc)" \
            CC=clang-14 \
            LD=ld.lld-14 \
            AR=llvm-ar-14 \
            NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14

      - name: Collect build outputs
        if: success()
        run: |
          mkdir -p artifacts
          found=0

          for f in \
            arch/arm64/boot/Image \
            arch/arm64/boot/Image.gz \
            arch/arm64/boot/Image.gz-dtb
          do
            if [ -f "$f" ]; then
              cp "$f" artifacts/
              found=1
            fi
          done

          find arch/arm64/boot/dts \
            -type f -name '*.dtb' \
            -exec cp --parents {} artifacts/ \; \
            2>/dev/null || true

          if [ "$found" -ne 1 ]; then
            echo "No recognized kernel image found"
            ls -lah arch/arm64/boot/
            exit 1
          fi

          find artifacts -type f -exec ls -lh {} \;

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vayu-baseline-kernel
          path: artifacts/
          if-no-files-found: error
          retention-days: 7