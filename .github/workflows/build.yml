
name: Build Vayu Kernel - Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex \
            libssl-dev libelf-dev \
            build-essential lzop cpio \
            device-tree-compiler python3 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            clang-14 lld-14 llvm-14 \
            lz4 zip

      - name: Inspect kernel source
        shell: bash
        run: |
          set -e

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $(git rev-parse --short HEAD)"

          test -f Makefile || {
            echo "::error::Kernel Makefile missing"
            exit 1
          }

          test -f arch/arm64/Makefile || {
            echo "::error::arch/arm64/Makefile missing"
            exit 1
          }

          test -d arch/arm64/configs || {
            echo "::error::ARM64 configs directory missing"
            exit 1
          }

          test -f scripts/config || {
            echo "::error::scripts/config missing"
            exit 1
          }

          echo "=== Vayu configurations ==="
          find arch/arm64/configs -type f \
            -iname '*vayu*' -print

          echo "=== BPF JIT source references ==="
          grep -nE 'is_func|jit_data' \
            arch/arm64/net/bpf_jit_comp.c || true

      - name: Select device configuration
        id: config
        shell: bash
        run: |
          set -e

          mapfile -t configs < <(
            find arch/arm64/configs -type f \
              -iname '*vayu*defconfig' | sort
          )

          if [ "${#configs[@]}" -eq 0 ]; then
            echo "::error::No Vayu defconfig found"
            exit 1
          fi

          if [ "${#configs[@]}" -gt 1 ]; then
            echo "::error::Multiple Vayu defconfigs found"
            printf '%s\n' "${configs[@]}"
            exit 1
          fi

          config="${configs[0]#arch/arm64/configs/}"
          config="${config%.config}"

          echo "Selected defconfig: $config"
          echo "defconfig=$config" >> "$GITHUB_OUTPUT"

      - name: Configure kernel
        shell: bash
        run: |
          set -e

          echo "=== Load Vayu defconfig ==="
          make ARCH=arm64 \
            "${{ steps.config.outputs.defconfig }}"

          echo "=== Disable incompatible BPF JIT for baseline test ==="
          scripts/config --disable BPF_JIT

          echo "=== Normalize configuration ==="
          make ARCH=arm64 olddefconfig

          echo "=== Verify important settings ==="
          grep -E \
            'CONFIG_ARM64=|CONFIG_BPF=|CONFIG_BPF_SYSCALL=|CONFIG_BPF_JIT=|CONFIG_DRM=|CONFIG_DRM_MSM=' \
            .config || true

          if grep -q '^CONFIG_BPF_JIT=y' .config; then
            echo "::error::BPF_JIT remains enabled"
            exit 1
          fi

          echo "=== Configuration completed ==="

      - name: Build kernel
        shell: bash
        run: |
          set -o pipefail

          make -j"$(nproc)" \
            ARCH=arm64 \
            CC=clang-14 \
            LD=ld.lld-14 \
            AR=llvm-ar-14 \
            NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Collect build outputs
        if: success()
        shell: bash
        run: |
          set -e

          mkdir -p artifacts
          found=0

          for f in \
            arch/arm64/boot/Image \
            arch/arm64/boot/Image.gz \
            arch/arm64/boot/Image.gz-dtb
          do
            if [ -f "$f" ]; then
              cp "$f" artifacts/
              found=1
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::Build finished without a kernel image"
            find arch/arm64/boot -maxdepth 3 -type f \
              -print 2>/dev/null || true
            exit 1
          fi

          cp .config artifacts/kernel.config

          echo "=== Kernel artifacts ==="
          find artifacts -maxdepth 1 -type f \
            -exec ls -lh {} \;

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vayu-baseline-kernel
          path: artifacts/
          if-no-files-found: error
          retention-days: 7